<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SolarPunk Kyrgyzstan — Future Paths</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1 id="title">SolarPunk Kyrgyzstan</h1>
      <p id="subtitle">Decisions shape the future. Repair is possible.</p>
      <div class="lang-switch">
        <button id="lang-en" class="lang-btn active">EN</button>
        <button id="lang-ru" class="lang-btn">RU</button>
      </div>
    </header>

    <div id="stats-panel" class="stats-panel hidden">
      <h3 id="stats-title">Current Status</h3>
      <div id="stats-grid" class="stats-grid"></div>
      <div id="score-display" class="score"></div>
    </div>

    <div id="story" class="story"></div>
    <div id="choices" class="choices"></div>

    <div id="game-over" class="game-over hidden">
      <h2 id="end-title">End of Path</h2>
      <p id="end-text"></p>
      <button id="restart">Restart</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/inkjs@2.2.2/dist/ink.js"></script>
  <script src="story.js"></script>
  <script src="main.js"></script>
</body>
</html>
