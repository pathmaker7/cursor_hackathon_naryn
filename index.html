<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SolarPunk Kyrgyzstan</title>
  <meta name="description" content="Lead Kyrgyzstan from 2026 to 2046. Ten decisions, six red lines, and a country that can really fall.">
  <meta name="theme-color" content="#06130d">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    } }
  </script>
</head>
<body>
  <header class="top">
    <div class="brand"><svg class="brand-logo" viewBox="0 0 64 64" aria-hidden="true" focusable="false">
        <defs><linearGradient id="lg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f3a2a"/><stop offset="1" stop-color="#06130d"/></linearGradient></defs>
        <rect width="64" height="64" rx="14" fill="url(#lg)"/>
        <g class="logo-rays" stroke="#f6c453" stroke-width="3" stroke-linecap="round"><path d="M32 9v7"/><path d="M14.5 17.5l5 5"/><path d="M49.5 17.5l-5 5"/><path d="M7 34h7"/><path d="M57 34h-7"/></g>
        <circle cx="32" cy="34" r="12" fill="#f6c453"/>
        <path d="M4 56L24 30l8 10 9-13 19 29z" fill="#0b2a1d" stroke="#3fd0b0" stroke-width="2" stroke-linejoin="round"/>
        <path d="M4 56h56v4a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4z" fill="#06130d"/>
        <path d="M34 55c0-9 5-14 13-15 0 9-4 14-13 15z" fill="#9be15d"/>
        <path d="M34 55c3-5 7-9 11-12" stroke="#06130d" stroke-width="1.4" fill="none" stroke-linecap="round"/>
      </svg><span id="brand-name">SolarPunk Kyrgyzstan</span></div>
    <ol class="progress" id="progress" aria-hidden="true"></ol>
    <div class="top-right">
      <span class="year-badge" id="year-badge">2026</span>
      <button class="toggle" id="fast-btn" type="button" aria-pressed="false" title="Skip all animations">Skip animations</button>
      <button class="icon-btn" id="sound-btn" type="button" aria-pressed="true" title="Sound">🔊</button>
      <div class="lang" role="group" aria-label="Language">
        <button type="button" id="lang-en" class="active">EN</button>
        <button type="button" id="lang-ru">RU</button>
      </div>
    </div>
  </header>

  <main class="layout">
    <section class="play-col">
      <div class="stage" id="stage">
        <div class="stage-hud">
          <span class="pill" id="tier-pill"></span>
          <span class="pill gold" id="score-pill"></span>
        </div>
        <div class="stage-frame" aria-hidden="true"></div>
        <div class="stage-harmony" id="stage-harmony"></div>
        <div class="floaters" id="floaters" aria-hidden="true"></div>
        <div class="stage-fallback" id="stage-fallback" hidden></div>
      </div>

      <div class="danger ok" id="danger" role="status" aria-live="polite"></div>

      <article class="card" id="card">
        <div class="topic" id="topic"></div>
        <p class="lead" id="lead"></p>
        <h1 class="question" id="question"></h1>
        <div class="choices" id="choices"></div>
        <div class="impact" id="impact" hidden aria-live="polite"></div>
      </article>
    </section>

    <aside class="stats-col" aria-label="National status">
      <div class="stats-head">
        <h2 class="stats-title" id="stats-title">National status</h2>
        <button type="button" class="toggle" id="reasons-btn" aria-pressed="false">Reasons</button>
      </div>
      <ul class="stats" id="stats"></ul>
    </aside>
  </main>

  <div class="overlay" id="overlay" hidden></div>
  <canvas class="confetti" id="confetti" aria-hidden="true"></canvas>

  <script type="module" src="main.js"></script>
</body>
</html>
