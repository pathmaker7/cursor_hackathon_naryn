<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SolarPunk Kyrgyzstan — Future Paths</title>
  <style>
    :root { --bg:#07140e; --card:#12281c; --text:#e8f5e9; --gold:#ffd54f; --accent:#7cb342; --border:rgba(124,179,66,.4); --good:#66bb6a; --bad:#ef5350; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:system-ui,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }
    .top { display:flex; justify-content:space-between; align-items:center; padding:0.7rem 1rem; border-bottom:1px solid var(--border); }
    .logo { color:var(--gold); font-weight:700; font-size:1.2rem; }
    .layout { display:grid; grid-template-columns:1fr 340px; gap:1rem; padding:1rem; max-width:1200px; margin:0 auto; }
    #canvas-wrap { background:var(--card); border-radius:12px; border:1px solid var(--border); height:340px; position:relative; }
    #story { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:1rem; margin:1rem 0; line-height:1.6; font-size:1.05rem; }
    .choices button { display:block; width:100%; text-align:left; background:var(--card); border:1px solid var(--border); color:var(--text); padding:0.9rem 1rem; margin:0.45rem 0; border-radius:10px; cursor:pointer; font-size:1rem; }
    .choices button:hover { border-color:var(--accent); background:#1a3a28; }
    .stats { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:1rem; }
    .stat { display:flex; justify-content:space-between; align-items:center; padding:0.45rem 0; border-bottom:1px solid rgba(255,255,255,.06); transition:background 0.3s; }
    .stat.flash-up { background:rgba(102,187,106,0.25); }
    .stat.flash-down { background:rgba(239,83,80,0.25); }
    .stat .v { font-weight:700; }
    .stat.good .v { color:var(--good); } .stat.bad .v { color:var(--bad); }
    .lang-btn { background:transparent; border:1px solid var(--border); color:var(--text); padding:0.2rem 0.6rem; border-radius:12px; cursor:pointer; margin-left:0.3rem; }
    .lang-btn.active { background:var(--accent); color:#111; }
    #reaction { text-align:center; font-size:1.4rem; font-weight:700; min-height:2rem; margin:0.5rem 0; }
    #game-over { display:none; margin-top:1rem; text-align:center; background:var(--card); padding:1.5rem; border-radius:12px; }
    #name-form { margin:1rem 0; }
    #name-form input { padding:0.5rem; border-radius:8px; border:1px solid var(--border); background:#0e1c14; color:var(--text); margin-right:0.5rem; }
    #name-form button { padding:0.5rem 1rem; background:var(--accent); border:none; border-radius:8px; cursor:pointer; font-weight:700; }
    .fireworks { position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:999; }
    @media(max-width:900px){ .layout{grid-template-columns:1fr;} }
  </style>
</head>
<body>
  <div class="top">
    <div class="logo">SolarPunk Kyrgyzstan</div>
    <div id="year">2026</div>
    <div>
      <button class="lang-btn active" id="en">EN</button>
      <button class="lang-btn" id="ru">RU</button>
    </div>
  </div>
  <div class="layout">
    <div>
      <div id="canvas-wrap"></div>
      <div id="reaction"></div>
      <div id="story"></div>
      <div id="choices" class="choices"></div>
    </div>
    <aside class="stats">
      <h3>National Status</h3>
      <div id="stats"></div>
      <div id="score" style="text-align:center;margin-top:0.8rem;color:var(--gold);font-weight:600;">Score: 48</div>
    </aside>
  </div>
  <div id="game-over">
    <h2 id="end-title">End of Path</h2>
    <p id="end-text"></p>
    <div id="name-form">
      <input id="player-name" placeholder="Your name" maxlength="30">
      <button id="save-score">Save Score</button>
    </div>
    <div id="leaderboard"></div>
    <button id="restart" style="margin-top:1rem;padding:0.6rem 1.4rem;background:var(--accent);border:none;border-radius:20px;cursor:pointer;font-weight:700;">Play Again</button>
  </div>
  <canvas id="fireworks" class="fireworks"></canvas>
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
  </script>
  <script type="module" src="main.js"></script>
</body>
</html>
